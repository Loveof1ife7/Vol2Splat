[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "vol2splat"
version = "0.1.0"
description = "Canonical volume to rendering, sampling, and export pipeline for medical and scientific 3D data"
readme = { file = "README_CN.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Vol2Splat Contributors" },
]
keywords = [
    "medical-imaging",
    "volume-rendering",
    "point-cloud",
    "3dgs",
    "paraview",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
    "typer>=0.12",
    "Pillow>=10.0",
]

[project.optional-dependencies]
medical = [
    "nibabel>=5.0",
]
torch = [
    "torch>=2.0",
]
render = [
    "vtk>=9.5.2",
]
wavelet = [
    "torch>=2.0",
    "ptwt>=0.1.9",
]
segmentation = [
    "torch>=2.4.1",
    "monai>=1.5.2",
]
full = [
    "nibabel>=5.0",
    "torch>=2.4.1",
    "ptwt>=0.1.9",
    "vtk>=9.5.2",
    "monai>=1.5.2",
]

[project.scripts]
vol2splat = "vol2splat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vol2splat"]
