io:
  reader: nii
  path: raw/{case_id}/ct.nii.gz
  # optional: input tiling for huge source volumes
  # tiling:
  #   enabled: true
  #   tile_size: 512
  #   tile_stride: 512
  #   write_tiles: true
  #   output_dir: outputs/{case_id}/input_tiles

preprocess:
  - name: canonicalize
    backend: torch
    target_spacing: 1.0
    pad_to_cube: true
    write_vti: true
    vti_path: outputs/{case_id}/{input_stem}_canonical.vti

render:
  renderer: pv_engine
  path: outputs/{case_id}
  executable: pvpython
  num: 64
  w: 800
  h: 800
  vfov: 45
  test_num: 10
  radius_scale: 0.8
  scene_bbox_size: 2.6
  cmaps: Cool to Warm
  band_count: 10
  shading: 0
  opaque_unit: 1.5
  fxaa: 1
  tf_mode: linear
  index: true
  qc:
    enabled: true
    skip_failed_tf: true
    min_nonzero_ratio: 0.01
    min_mean_intensity: 0.01
    min_intensity_std: 0.005

sampling:
  name: opacity
  n_points: 50000
  tf_backend: torch
  tf_device: cuda

export:
  writer: ply
  path: outputs/{case_id}
