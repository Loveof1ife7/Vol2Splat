io:
  reader: nii
  path: raw/s0000/ct.nii.gz
  # optional: split very large input volume before preprocess
  # tiling:
  #   enabled: true
  #   tile_size: 512
  #   tile_stride: 512
  #   write_tiles: true
  #   output_dir: outputs/s0000/input_tiles

preprocess:
  - name: canonicalize
    backend: torch
    target_spacing: 1.0
    # default behavior:
    # 1. min-max normalize scalar volume to [0,1]
    # 2. pad with 0 after normalization
    pad_to_cube: true
    write_vti: true
    vti_path: outputs/s0000/s0000_ct_canonical.vti

render:
  renderer: pv_engine
  path: outputs/s0000/
  executable: pvpython
  num: 64
  w: 800
  h: 800
  vfov: 45
  test_num: 10
  radius_scale: 0.8
  scene_bbox_size: 2.6
  cmaps: Cool to Warm
  band_count: 10
  shading: 0
  opaque_unit: 1.5
  fxaa: 1
  tf_mode: linear
  index: true
  # optional: render QC
  qc:
    enabled: true
    skip_failed_tf: true
    min_nonzero_ratio: 0.01
    min_mean_intensity: 0.01
    min_intensity_std: 0.005
    # segmentation:
    #   enabled: true
    #   backend: monai_unet
    #   model_path: /path/to/your_monai_unet_weights.pt
    #   # or auto-download weights if model_path does not exist:
    #   # model_url: https://...
    #   # download_dir: .cache/segmentation_models
    #   # sha256: ...
    #   device: cuda
    #   input_size: [256, 256]
    #   in_channels: 4
    #   out_channels: 2
    #   channels: [32, 64, 128, 256]
    #   strides: [2, 2, 2]
    #   target_class: 1gu
    #   mask_threshold: 0.5
    #   min_confidence: 0.5
    #   min_foreground_ratio: 0.001
    #   min_detected_frames: 2
    #   min_detected_ratio: 0.2
  
sampling:
  name: opacity
  n_points: 50000
  tf_backend: torch
  tf_device: cuda

export:
  writer: ply
  path: outputs/s0000/
