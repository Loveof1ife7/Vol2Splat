batch:
  raw_root: raw/totalseg3d
  size: 20
  shuffle: false
  seed: 7
  case_range: s0000~s0025
  case_start: s0000
  case_end: s0025
  output_root: /root/autodl-tmp/projects/Vol2Splat/outputs/generated_stack/range_0000_0025_ygb_single
io:
  reader: nii
  path: raw/totalseg3d/{case_id}/ct.nii.gz
preprocess:
- name: canonicalize
  backend: torch
  target_spacing: 1.0
  pad_to_cube: true
  write_vti: true
  vti_path: outputs/{batch_id}/{case_id}/{input_stem}_canonical.vti
render:
  path: outputs/{batch_id}/{case_id}
  renderer: pv_engine
  executable: pvpython
  num: 84
  test_num: 20
  w: 512
  h: 512
  band_count: 10
  opaque_unit: 7.0
  scene_bbox_size: 2.6
  opacity_scale: 0.3
  tf_mode: linear_gs
  cmaps:
  - Yellow - Gray - Blue
  hist_eq: false
  camera_convention: opencv
  qc:
    enabled: true
    skip_failed_tf: true
    min_nonzero_ratio: 0.01
    min_mean_intensity: 0.01
    min_intensity_std: 0.005
sampling:
  name: opacity
  n_points: 100000
  tf_backend: torch
  tf_device: cuda
  uniform_tf_filter: true
  uniform_stride: auto
  alpha_threshold: 0.0
  jitter: true
  anisotropic_init: true
  aniso_field: alpha
  aniso_voxel_size_mode: mean_spacing
  aniso_tangent_scale_mul: 1.2
  aniso_normal_scale_mul: 0.1
  aniso_min_linear_scale: 1.0e-06
export:
  writer: gs_ply
  params:
    sh_degree: 3
    negate_yz_axes: true
    default_linear_scale: 0.01
