batch:
  size: 20
  shuffle: false
  seed: 7
  # 可选：只跑某个病例范围，例如 s0000~s0100
  # case_range: s0000~s0100
  # case_start: s0000
  # case_end: s0100
  # 可选：显式指定/排除病例
  # case_ids: [s0001, s0007, s0042]
  # exclude_case_ids: [s0005]

io:
  reader: nii
  path: raw/{case_id}/ct.nii.gz

preprocess:
  - name: canonicalize
    backend: torch
    target_spacing: 1.0
    pad_to_cube: true
    write_vti: true
    vti_path: outputs/{batch_id}/{case_id}/{input_stem}_canonical.vti

render:
  renderer: pv_engine
  path: outputs/{batch_id}/{case_id}
  executable: pvpython

  # 视角与分辨率
  num: 84
  test_num: 20
  val_num: 0
  w: 512
  h: 512
  vfov: 45
  radius_scale: 0.8
  scene_bbox_size: 2.6

  # TF：每个病例从池中随机抽 band_count 个配色（同病例可复现；见 vol2splat/batch.py）
  cmaps_random: true
  # cmaps_pool: 可省略，省略则用默认池（与 batch_render_datasets 一致）
  # cmaps_seed: 可省略，省略则用 batch.seed + case_id 派生随机种子
  band_count: 10
  tf_mode: linear_vol2splat
  opacity_scale: 1.0
  hist_eq: false
  camera_convention: opencv

  shading: 0
  opaque_unit: 3.0
  fxaa: 1
  index: true

  qc:
    enabled: true
    skip_failed_tf: true
    min_nonzero_ratio: 0.01
    min_mean_intensity: 0.01
    min_intensity_std: 0.005

sampling:
  name: opacity
  n_points: 200000
  tf_backend: torch
  tf_device: cuda

export:
  writer: ply
  path: outputs/{batch_id}/{case_id}
