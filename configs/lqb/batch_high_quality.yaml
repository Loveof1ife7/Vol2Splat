batch:
   case_ids:
    - s0244
    - s0652
    - s0693
    - s0703
    - s1009
    - s1073
    - s1348
io:
  reader: nii
  path: raw/{case_id}/ct.nii.gz
preprocess:
- name: canonicalize
  backend: torch
  target_spacing: 1.0
  pad_to_cube: true
  write_vti: true
  vti_path: outputs/{batch_id}/{case_id}/{input_stem}_canonical.vti
render:
  path: outputs/{batch_id}/{case_id}
  renderer: pv_engine
  executable: pvpython
  num: 84
  test_num: 20
  w: 512
  h: 512
  opaque_unit: 2.0
  scene_bbox_size: 2.6
  camera_convention: opencv
  tf_json_root: raw/high_quality
  
  qc:
    enabled: true
    skip_failed_tf: true
    min_nonzero_ratio: 0.01
    min_mean_intensity: 0.01
    min_intensity_std: 0.005
sampling:
  name: opacity
  n_points: 100000
  tf_backend: torch
  tf_device: cuda
  uniform_tf_filter: true
  uniform_stride: auto
  alpha_threshold: 0.0
  jitter: true
  anisotropic_init: true
  aniso_field: alpha
  aniso_voxel_size_mode: mean_spacing
  aniso_tangent_scale_mul: 1.2
  aniso_normal_scale_mul: 0.1
  aniso_min_linear_scale: 1.0e-06
export:
  writer: gs_ply
  params:
    sh_degree: 3
    negate_yz_axes: true
    default_linear_scale: 0.01
