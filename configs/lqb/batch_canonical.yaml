batch:
  raw_root: data/vbm_teaser_cases
  output_root: outputs/VBM-teaser
  case_glob: "*"
  filename: volume.vti
  size: 6
  shuffle: false
  seed: 7

io:
  reader: vti
  path: data/vbm_teaser_cases/{case_id}/volume.vti

preprocess:
  - name: canonicalize
    backend: torch
    target_spacing: 1.0
    pad_to_cube: true
    write_vti: true
    vti_path: outputs/{case_id}/canonical.vti
